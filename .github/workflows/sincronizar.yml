name: Sincronizar catálogo

on:
  schedule:
    - cron: "17 */6 * * *"   # cada 6 horas
  workflow_dispatch:
    inputs:
      max_archivos:
        description: "Máximo de archivos nuevos a procesar (0 = todos los pendientes)"
        default: "0"
  push:
    branches: [main]
    paths: ["sitio/**", "!sitio/datos/**", "!sitio/minis/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: catalogo
  cancel-in-progress: false

jobs:
  indexar:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: indexador/requirements.txt

      - name: Instalar dependencias
        if: github.event_name != 'push'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -r indexador/requirements.txt

      - name: Indexar Dropbox
        if: github.event_name != 'push'
        env:
          DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
          DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
          DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CARPETA_DROPBOX: ${{ vars.CARPETA_DROPBOX }}
          CARPETAS_EXCLUIDAS: ${{ vars.CARPETAS_EXCLUIDAS }}
          MAX_USD: ${{ vars.MAX_USD }}
          MAX_ARCHIVOS: ${{ inputs.max_archivos }}
          MAX_MINUTOS: "300"
          HILOS: "8"
        run: |
          if [ -z "$DROPBOX_REFRESH_TOKEN" ] || [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::Faltan los secretos DROPBOX_REFRESH_TOKEN o ANTHROPIC_API_KEY; solo se publica la web."
            exit 0
          fi
          python indexador/indexar.py

      - name: Guardar cambios del catálogo
        if: github.event_name != 'push'
        run: |
          git config user.name "catalogo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sitio/datos sitio/minis indexador/errores.json || true
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -q -m "Actualizar catálogo ($(date -u +%Y-%m-%dT%H:%MZ))"
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; sleep $((i*10)); done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio

  publicar:
    needs: indexar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
